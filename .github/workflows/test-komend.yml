name: Test komend na serwerze

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja Minecraft, np. 26.3 albo latest'
        default: 'latest'
      engine:
        description: 'Silniki do sprawdzenia'
        type: choice
        options: [both, vanilla, paper]
        default: both
  push:
    branches: [main]
    paths:
      - .github/workflows/test-komend.yml
      - tools/test_commands.py
      - tools/polacz_testy.py
      - data/komendy.json
      - data/cennik.json
      - data/bledy.json
      - assets/js/komendy.js
      - assets/js/export.js
      - assets/js/motd.js
      - assets/js/komnaty-datapack.js
      - assets/js/komnaty-gen.js
      - assets/js/komnaty-mistrz.js
      - tools/pakuj_komnaty.mjs
      - tools/test_mechaniki.py

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.config.outputs.engines }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Ustal jedną wersję dla obu silników
        id: config
        env:
          TEST_VERSION: ${{ inputs.version || 'latest' }}
          TEST_ENGINE: ${{ inputs.engine || 'both' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from tools.test_commands import get_json

          version = os.environ['TEST_VERSION']
          if version == 'latest':
              url = 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
              version = get_json(url)['latest']['release']
          if not re.fullmatch(r'[0-9][0-9A-Za-z.+-]*', version):
              raise ValueError('Nieprawidłowa wersja')
          selected = os.environ['TEST_ENGINE']
          engines = ['vanilla', 'paper'] if selected == 'both' else [selected]
          if any(engine not in ('vanilla', 'paper') for engine in engines):
              raise ValueError('Nieprawidłowy silnik')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('version=' + version, file=out)
              print('engines=' + json.dumps(engines), file=out)
          PY

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.prepare.outputs.engines) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test komend
        env:
          TEST_VERSION: ${{ needs.prepare.outputs.version }}
          TEST_ENGINE: ${{ matrix.engine }}
        run: python3 tools/test_commands.py --version "$TEST_VERSION" --engine "$TEST_ENGINE" --report-dir "$RUNNER_TEMP/raport"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serwer-${{ matrix.engine }}
          path: ${{ runner.temp }}/raport/*.json
          if-no-files-found: error

  report:
    needs: [prepare, test]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: serwer-*
          path: raporty
      - name: Połącz wyniki
        env:
          TEST_VERSION: ${{ needs.prepare.outputs.version }}
          TEST_ENGINES: ${{ join(fromJSON(needs.prepare.outputs.engines), ' ') }}
        run: |
          read -ra engines <<< "$TEST_ENGINES"
          python3 tools/polacz_testy.py raporty wynik "$TEST_VERSION" "${engines[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: wyniki-komend
          path: wynik
          if-no-files-found: error
