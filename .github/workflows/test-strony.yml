name: Testy strony
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  komnaty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sprawdź 60000 komnat
        run: node tools/test_komnaty.mjs
      - name: Sprawdź bezpieczne odradzanie
        run: node tools/test_checkpointy.mjs
      - name: Bot przechodzi komnaty mistrzowskie M1–M10
        run: node tools/test_mistrz.mjs
      - name: Sprawdź import budowli Schematic
        run: node tools/test_schem.mjs
      - name: Sprawdź kombinacje koła wyzwań
        run: node tools/test_kolo.mjs
      - name: Odczytaj plik prototypu Latającej Twierdzy
        run: node tools/test_twierdza.mjs
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Przygotuj przeglądarkę testową
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Sprawdź stronę i narzędzia
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          python3 tools/test_strony.py
