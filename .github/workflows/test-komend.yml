# Uruchamia prawdziwy serwer Minecraft i sprawdza każdą komendę z kreatora.
# Wynik trafia do data/testy.json, a strona pokazuje status „sprawdzone”.
name: Test komend na serwerze

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja Minecraft (np. 26.3 albo latest)"
        default: "latest"
      engine:
        description: "vanilla albo paper"
        default: "vanilla"
  push:
    branches: [main]
    paths: ["data/komendy.json", "tools/test_commands.py", "assets/js/export.js", "data/bledy.json", "assets/js/motd.js"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test komend
        run: python3 tools/test_commands.py --version "${{ inputs.version || 'latest' }}" --engine "${{ inputs.engine || 'vanilla' }}"
      - name: Zapisz wyniki
        if: always()
        run: |
          git config user.name "kilekcraft-bot"
          git config user.email "kilekcraft-bot@users.noreply.github.com"
          git add data/testy.json data/datapack.json
          git diff --cached --quiet || (git commit -m "Wyniki testu komend" && git pull --rebase && git push)
